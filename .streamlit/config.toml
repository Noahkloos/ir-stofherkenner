# Instellingen voor Streamlit (de webapp)

[server]
# Streamlit zelf laat bestanden tot 20 MB door. De app keurt alles boven 5 MB
# daarna zelf af met een duidelijke Nederlandse melding (zie stofherkenner/validatie.py).
maxUploadSize = 20
# headless: Streamlit vraagt bij de eerste start niet om een e-mailadres en opent
# de browser niet zelf; start.bat opent de browser.
headless = true

[browser]
# Geen gebruiksstatistieken naar Streamlit sturen
gatherUsageStats = false

[theme]
# Kleuren in de stijl van Windows 7 (de rest van de opmaak staat in stijl.css)
base = "light"
primaryColor = "#3399ff"
backgroundColor = "#f0f0f0"
secondaryBackgroundColor = "#e4ecf6"
textColor = "#1e1e1e"
